<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="divider">
  <defs>
    <radialGradient id="b" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffb878"/>
      <stop offset=".45" stop-color="#ec6a1f"/>
      <stop offset="1" stop-color="#8a3a0d"/>
    </radialGradient>
    <clipPath id="c"><circle r="12"/></clipPath>
  </defs>
  <style>
    .line { animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .roll { animation: roll 7s linear infinite; }
    @keyframes roll { from { transform: translateX(-40px); } to { transform: translateX(1240px); } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <line class="line" x1="0" y1="35" x2="1200" y2="35" stroke="#e8641b" stroke-width="3" stroke-dasharray="14 10"/>
  <circle cx="600" cy="35" r="9" fill="#e8641b"/>
  <g class="roll">
    <g transform="translate(0 21)">
      <circle r="12" fill="url(#b)"/>
      <g clip-path="url(#c)"><g class="spin" fill="none" stroke="#1a1208" stroke-width="1.6">
        <circle r="12" stroke="none"/>
        <path d="M0 -12 V12 M-12 0 H12 M-8 -9 C -3 -4 -3 4 -8 9 M8 -9 C 3 -4 3 4 8 9"/>
      </g></g>
      <circle r="12" fill="none" stroke="#1a1208" stroke-width="1.6"/>
    </g>
  </g>
</svg>
