<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ansh Gupta, Backend and AI Engineer">
  <title>Ansh Gupta · Backend &amp; AI Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0804"/>
      <stop offset=".7" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#2a1a0c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ad6c"/>
      <stop offset="1" stop-color="#9a6230"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2d6" stop-opacity=".5"/>
      <stop offset=".75" stop-color="#ffcf8a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ballFill" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffb878"/>
      <stop offset=".45" stop-color="#ec6a1f"/>
      <stop offset=".85" stop-color="#a8440e"/>
      <stop offset="1" stop-color="#6a2805"/>
    </radialGradient>
    <clipPath id="ballClip"><circle r="30"/></clipPath>
    <pattern id="planks" width="64" height="92" patternUnits="userSpaceOnUse">
      <rect width="32" height="92" fill="#000" opacity=".05"/>
      <rect x="31" width="1.5" height="92" fill="#5a3412" opacity=".35"/>
      <rect x="63" width="1.5" height="92" fill="#5a3412" opacity=".35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; font-weight: 700; }
    .jersey { font-family: Impact, 'Anton', 'Arial Narrow Bold', 'Arial Black', sans-serif; }
    .beam { animation: sweep 9s ease-in-out infinite alternate; }
    .b1 { transform-origin: 250px -20px; }
    .b2 { transform-origin: 640px -20px; animation-delay: -3s; animation-duration: 11s; }
    .b3 { transform-origin: 1030px -20px; animation-delay: -6s; }
    @keyframes sweep { from { transform: rotate(-14deg); opacity: .65; } to { transform: rotate(14deg); opacity: 1; } }

    .flash { opacity: 0; animation: flash 4.8s infinite; }
    @keyframes flash { 0%, 92%, 100% { opacity: 0; } 94% { opacity: 1; } 96% { opacity: .2; } }

    .blink { animation: blink 1.1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    .title { animation: slam .7s cubic-bezier(.2, 1.4, .4, 1) both; transform-box: fill-box; transform-origin: left bottom; }
    @keyframes slam { from { opacity: 0; transform: scale(1.4); } to { opacity: 1; transform: none; } }

    .role { opacity: 0; animation: role 10s infinite both; }
    .r2 { animation-delay: 2.5s; } .r3 { animation-delay: 5s; } .r4 { animation-delay: 7.5s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(14px); }
      3%, 22% { opacity: 1; transform: none; }
      25%, 100% { opacity: 0; transform: translateY(-14px); }
    }

    .bounce { animation: bounce 1.15s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(.5, 0, .85, .35); }
      48% { transform: translateY(118px); animation-timing-function: cubic-bezier(.15, .65, .5, 1); }
    }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 2.3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shade 1.15s infinite; }
    @keyframes shade {
      0%, 100% { transform: scale(.55); opacity: .25; animation-timing-function: cubic-bezier(.5, 0, .85, .35); }
      48% { transform: scale(1); opacity: .55; animation-timing-function: cubic-bezier(.15, .65, .5, 1); }
    }
    .net { transform-box: fill-box; transform-origin: top; animation: net 1.15s infinite; }
    @keyframes net { 0%, 30%, 100% { transform: none; } 10% { transform: scaleY(1.12); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .role { opacity: 0; } .r1 { opacity: 1; } }
  </style>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- crowd camera flashes -->
  <g fill="#fff8ea">
    <circle class="flash" cx="110" cy="40" r="2.5" style="animation-delay:.2s"/>
    <circle class="flash" cx="420" cy="28" r="2" style="animation-delay:1.4s"/>
    <circle class="flash" cx="560" cy="62" r="2.5" style="animation-delay:2.9s"/>
    <circle class="flash" cx="760" cy="34" r="2" style="animation-delay:.9s"/>
    <circle class="flash" cx="860" cy="70" r="2.5" style="animation-delay:3.6s"/>
    <circle class="flash" cx="1120" cy="46" r="2" style="animation-delay:2.1s"/>
    <circle class="flash" cx="250" cy="76" r="2" style="animation-delay:4.1s"/>
    <circle class="flash" cx="680" cy="16" r="2" style="animation-delay:1.9s"/>
  </g>

  <!-- spotlights -->
  <g style="mix-blend-mode:screen">
    <polygon class="beam b1" points="230,-20 270,-20 420,300 80,300" fill="url(#beam)"/>
    <polygon class="beam b2" points="620,-20 660,-20 810,300 470,300" fill="url(#beam)"/>
    <polygon class="beam b3" points="1010,-20 1050,-20 1200,300 860,300" fill="url(#beam)"/>
  </g>

  <!-- hardwood floor -->
  <rect y="268" width="1200" height="92" fill="url(#floor)"/>
  <rect y="268" width="1200" height="92" fill="url(#planks)"/>
  <g fill="none" stroke="#fff8ea" stroke-width="3" opacity=".7">
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <path d="M520 360 A120 60 0 0 1 760 360"/>
    <line x1="640" y1="270" x2="640" y2="360"/>
  </g>
  <rect y="268" width="1200" height="92" fill="#e8641b" opacity=".08"/>

  <!-- kicker -->
  <g class="mono" font-size="15" letter-spacing="4" fill="#e8641b">
    <rect x="56" y="62" width="370" height="28" fill="#1a1208" stroke="#e8641b" stroke-width="2" transform="skewX(-12)"/>
    <circle class="blink" cx="84" cy="76" r="5" fill="#e0313c"/>
    <text x="98" y="81">NOW ENTERING · JERSEY #01</text>
  </g>

  <!-- name -->
  <g class="title">
    <text x="66" y="196" class="jersey" font-size="112" letter-spacing="2" fill="#e8641b">ANSH GUPTA</text>
    <text x="60" y="190" class="jersey" font-size="112" letter-spacing="2" fill="#fff8ea">ANSH GUPTA</text>
  </g>

  <!-- position ticker -->
  <g transform="translate(60 214)">
    <text y="30" class="jersey" font-size="28" letter-spacing="2" fill="#fff8ea">POSITION:</text>
    <rect x="132" y="2" width="300" height="38" fill="#e8641b" transform="skewX(-8)"/>
    <g class="jersey" font-size="27" letter-spacing="2" fill="#1a1208">
      <text class="role r1" x="146" y="31">BACKEND ENGINEER</text>
      <text class="role r2" x="146" y="31">AI AGENT BUILDER</text>
      <text class="role r3" x="146" y="31">RAG SPECIALIST</text>
      <text class="role r4" x="146" y="31">ML RESEARCHER</text>
    </g>
  </g>

  <!-- LIVE badge -->
  <g class="mono" font-size="14" letter-spacing="3">
    <rect x="1078" y="20" width="96" height="30" fill="none" stroke="#e0313c" stroke-opacity=".6" stroke-width="2"/>
    <circle class="blink" cx="1096" cy="35" r="5" fill="#e0313c"/>
    <text x="1108" y="40" fill="#e0313c">LIVE</text>
  </g>

  <!-- hoop -->
  <g transform="translate(905 70)">
    <rect x="0" y="0" width="150" height="88" rx="5" fill="#fff8ea" fill-opacity=".92" stroke="#e8641b" stroke-width="4"/>
    <rect x="48" y="36" width="54" height="38" fill="none" stroke="#e8641b" stroke-width="4"/>
    <rect x="67" y="86" width="16" height="10" fill="#e8641b"/>
    <ellipse cx="75" cy="100" rx="44" ry="7" fill="none" stroke="#e8641b" stroke-width="5"/>
    <g class="net" stroke="#fff8ea" stroke-width="1.6" fill="none" opacity=".9">
      <path d="M33 101 L45 148 M47 104 L55 148 M61 106 L66 148 M75 107 L75 148 M89 106 L84 148 M103 104 L95 148 M117 101 L105 148"/>
      <path d="M36 118 Q75 128 114 118 M41 134 Q75 142 109 134 M45 148 L105 148"/>
    </g>
  </g>

  <!-- dribbling ball -->
  <ellipse class="shadow" cx="1080" cy="274" rx="34" ry="7" fill="#000"/>
  <g transform="translate(1080 122)">
    <g class="bounce">
      <circle r="30" fill="url(#ballFill)"/>
      <g clip-path="url(#ballClip)">
        <g class="spin" fill="none" stroke="#1a1208" stroke-width="2.6" stroke-linecap="round">
          <circle r="30" fill="none" stroke="none"/>
          <path d="M0 -30 V30 M-30 0 H30 M-20 -23 C -8 -10 -8 10 -20 23 M20 -23 C 8 -10 8 10 20 23"/>
        </g>
      </g>
      <ellipse cx="-9" cy="-12" rx="9" ry="5" fill="#fff" opacity=".25" transform="rotate(-30 -9 -12)"/>
      <circle r="30" fill="none" stroke="#1a1208" stroke-width="2.5"/>
    </g>
  </g>

  <!-- education line -->
  <text x="60" y="300" class="mono" font-size="15" letter-spacing="3" fill="#1a1208">B.TECH ECE · UNIVERSITY OF DELHI · MINOR IN AI/ML</text>
  <text x="60" y="326" class="mono" font-size="13" letter-spacing="3" fill="#1a1208" opacity=".75">RAG · AI AGENTS · FASTAPI · POSTGRESQL · DOCKER · PYTORCH</text>
</svg>
